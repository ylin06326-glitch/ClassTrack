<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClassTrack - 学生二维码打印</title>
<style>
/* ============================================================
   ClassTrack Print — 液态玻璃视觉
   打印时自动去除玻璃效果
   ============================================================ */
:root {
  --glass-blur: 14px; --glass-saturate: 1.3;
  --blue: #7EB5D6; --text: #5D5A5A; --text-light: #999595;
  --radius: 18px; --radius-sm: 14px;
  --shadow-sm: 0 2px 10px rgba(80,60,50,0.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#F5F1ED; padding:20px;
}
/* 纯色背景装饰 */
body::before {
  content:""; position:fixed; top:-150px; right:-100px;
  width:350px; height:350px; border-radius:50%;
  background:radial-gradient(circle, rgba(126,181,214,0.06) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

/* 工具栏 — 玻璃导航 */
.toolbar{
  max-width:1200px; margin:0 auto 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: var(--radius); padding:14px 20px;
  box-shadow: var(--shadow-sm);
  position:relative; z-index:1; overflow:hidden;
}
.toolbar::after {
  content:""; position:absolute; top:0; left:5%; right:5%;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  pointer-events:none;
}
.toolbar select,.toolbar input{
  padding:7px 12px;
  border:1px solid rgba(255,255,255,0.25);
  border-radius:12px; font-size:.85rem; font-family:inherit;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.toolbar label{font-size:.85rem;font-weight:600;color:var(--text)}
.toolbar button{
  padding:8px 18px; border:1px solid rgba(255,255,255,0.25);
  border-radius:14px; font-size:.85rem; font-weight:700;
  cursor:pointer; font-family:inherit; transition: transform 0.2s ease-out, opacity 0.2s ease-out;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.btn-print{
  background: linear-gradient(135deg, rgba(126,181,214,0.6), rgba(142,200,224,0.65));
  color:white; box-shadow:0 2px 10px rgba(126,181,214,0.22);
}
.btn-print:hover{transform:translateY(-1px)}

.grid-container{
  max-width:1200px; margin:0 auto;
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  position:relative; z-index:1;
}

/* 二维码卡片 — 玻璃卡片 */
.qr-card{
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 16px; padding:14px; text-align:center;
  box-shadow: var(--shadow-sm);
  page-break-inside:avoid; position:relative; overflow:hidden;
}
.qr-card::after {
  content:""; position:absolute; top:0; left:8%; right:8%;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  pointer-events:none;
}
.qr-card .name{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:4px}
.qr-card .code{font-size:.7rem;color:var(--text-light);margin-bottom:8px}
.qr-card .group{font-size:.7rem;color:var(--blue);margin-bottom:6px}
.qr-code{display:flex;justify-content:center}
.empty-state{grid-column:1/-1;text-align:center;padding:60px;color:var(--text-light)}

/* 打印时去除玻璃效果 */
@media print{
  body{background:white;padding:10px}
  body::before{display:none}
  .toolbar{display:none}
  .grid-container{grid-template-columns:repeat(4,1fr);gap:8px}
  .qr-card{
    box-shadow:none; border:1px dashed #ddd; padding:10px;
    background:white!important;
    backdrop-filter:none!important; -webkit-backdrop-filter:none!important;
  }
  .qr-card::after{display:none}
}
@media(max-width:800px){.grid-container{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="toolbar">
  <label>🏫 班级：</label>
  <select id="printClassSelect"><option value="">加载中...</option></select>
  <label>📐 列数：</label>
  <select id="printCols">
    <option value="4">4列</option>
    <option value="3">3列</option>
    <option value="5">5列</option>
  </select>
  <button class="btn-print" onclick="window.print()">🖨️ 打印</button>
  <button class="btn-print" onclick="refreshGrid()">🔄 刷新</button>
  <span style="font-size:.8rem;color:#999;margin-left:auto" id="printCount"></span>
</div>
<div class="grid-container" id="qrGrid">
  <div class="empty-state">正在加载学生列表...</div>
</div>

<script>
const API_BASE = window.location.origin;
let currentClassId = 1;

async function loadClasses() {
  const res = await fetch(API_BASE + "/api/classes").then(r => r.json());
  if (res.code === 0) {
    const sel = document.getElementById("printClassSelect");
    sel.innerHTML = res.data.map(c => `<option value="${c.id}" ${c.id === res.active_id ? "selected" : ""}>${c.name}</option>`).join("");
    currentClassId = res.active_id;
    sel.addEventListener("change", () => { currentClassId = parseInt(sel.value); refreshGrid(); });
  }
}

document.getElementById("printCols").addEventListener("change", refreshGrid);

async function refreshGrid() {
  const grid = document.getElementById("qrGrid");
  const cols = parseInt(document.getElementById("printCols").value);
  grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  grid.innerHTML = '<div class="empty-state">⏳ 加载中...</div>';

  const res = await fetch(API_BASE + `/api/students?class_id=${currentClassId}`).then(r => r.json());
  if (res.code !== 0 || res.data.length === 0) {
    grid.innerHTML = '<div class="empty-state">📭 该班级暂无学生，请先导入名单</div>';
    return;
  }

  document.getElementById("printCount").textContent = `共 ${res.data.length} 名学生`;
  grid.innerHTML = "";

  for (const s of res.data) {
    const card = document.createElement("div");
    card.className = "qr-card";
    const code = s.student_code || `S${s.id}`;
    // 使用服务端生成的二维码图片（离线可用，无需 CDN）
    const qrUrl = `${API_BASE}/api/qrcode?data=${encodeURIComponent(code)}&size=110`;
    card.innerHTML = `
      <div class="name">${escapeHtml(s.name)}</div>
      <div class="code">学号: ${escapeHtml(code)}</div>
      ${s.group_name ? `<div class="group">📁 ${escapeHtml(s.group_name)}</div>` : ""}
      <div class="qr-code"><img src="${qrUrl}" width="100" height="100" alt="QR-${escapeHtml(code)}" style="display:block"></div>
    `;
    grid.appendChild(card);
  }

  function escapeHtml(text) {
    const d = document.createElement("div");
    d.textContent = text;
    return d.innerHTML;
  }
}

loadClasses().then(refreshGrid);
</script>
</body>
</html>
