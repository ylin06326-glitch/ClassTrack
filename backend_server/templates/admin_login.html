<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassTrack.com — 管理员登录</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-container">
  <div class="login-card card">
    <div class="card-body">
      <div class="login-icon">🔐</div>
      <h2>ClassTrack.com 管理后台</h2>

      <div class="form-group">
        <label>管理密码</label>
        <input
          type="password"
          class="input"
          id="passwordInput"
          placeholder="请输入管理密码"
          style="text-align:center;font-size:1rem;"
          autofocus
        >
      </div>

      <button class="btn btn-primary btn-lg" id="btnLogin" style="width:100%;justify-content:center;">
        🔓 登录
      </button>

      <div class="login-error" id="loginError">密码错误，请重试</div>

      <div style="margin-top:20px;">
        <a href="/" style="font-size:.82rem;color:var(--text-light);text-decoration:none;">🏠 返回首页</a>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script>
function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(function() {
    el.classList.add('fade-out');
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
  }, 3000);
}

document.getElementById('btnLogin').addEventListener('click', function() {
  var pw = document.getElementById('passwordInput').value;
  if (!pw) { showToast('请输入密码', 'warn'); return; }

  var btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = '⏳ 验证中...';

  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = '🔓 登录';

      if (res.code === 0) {
        showToast('登录成功，跳转中...', 'success');
        setTimeout(function() { window.location.href = res.data.redirect; }, 500);
      } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = '🔓 登录';
      showToast('网络错误', 'error');
    });
});

document.getElementById('passwordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { document.getElementById('btnLogin').click(); }
});
</script>

</body>
</html>
